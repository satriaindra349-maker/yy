<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWS YAH SAYANGG! ❤️🔥</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #ff007f, #7928ca, #00dfd8, #ff4e50);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Container Card */
        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border: 3px solid rgba(255, 255, 255, 0.5);
            padding: 40px 25px;
            border-radius: 35px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.5);
            animation: bounceIn 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            z-index: 10;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .emoji-header {
            font-size: 80px;
            animation: shake 1s infinite alternate;
            display: inline-block;
        }

        @keyframes shake {
            0% { transform: rotate(-10deg) scale(1); }
            100% { transform: rotate(10deg) scale(1.2); }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 38px;
            color: #fff;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #ff007f;
            margin: 15px 0;
            letter-spacing: 1px;
            line-height: 1.2;
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            from { text-shadow: 0 0 10px #fff, 0 0 20px #ff007f, 0 0 30px #ff007f; }
            to { text-shadow: 0 0 20px #fff, 0 0 30px #00dfd8, 0 0 50px #00dfd8; }
        }

        p {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 30px;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.4);
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(45deg, #ff007f, #ff4e50);
            color: white;
            border: none;
            padding: 16px 25px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.5);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.08) rotate(-2deg);
            box-shadow: 0 15px 35px rgba(255, 0, 127, 0.8);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #00dfd8, #0072ff);
            box-shadow: 0 10px 25px rgba(0, 223, 216, 0.5);
        }

        .btn-secondary:hover {
            box-shadow: 0 15px 35px rgba(0, 223, 216, 0.8);
        }

        /* Floating particles */
        .bg-emoji {
            position: absolute;
            font-size: 30px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 5s linear infinite;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji-header">🚨💖🚨</div>
        <h1>GWS YAH SAYANGG!</h1>
        <p>MIYA GA BOLEH SAKIT-SAKIT! 😡<br>Cepat sembuh, makan yg banyak, minum obatnya! Biar bisa ceria & senyum lagi!! ✨💊⚡</p>
        
        <div class="btn-group">
            <button class="btn" onclick="hebohMax()">💥 LEDAKKAN SEMANGAT! 💥</button>
            <button class="btn btn-secondary" onclick="kirimDosisPeluk()">🤗 DOSIS PELUK VIRTUAL! 🤗</button>
        </div>
    </div>

    <script>
        // Suara Efek Nada Sintetis (Web Audio API)
        function playSound(freq, type = 'sine') {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch(e) {}
        }

        // Tombol 1: Konfeti & Kembang Api
        function hebohMax() {
            playSound(587.33, 'triangle'); // D5 note
            setTimeout(() => playSound(880, 'triangle'), 100);

            // Confetti pesta
            confetti({
                particleCount: 120,
                spread: 100,
                origin: { y: 0.6 }
            });

            // Tembakan kiri kanan
            setTimeout(() => {
                confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 } });
            }, 250);
        }

        // Tombol 2: Rain Hati
        function kirimDosisPeluk() {
            playSound(440, 'sine');
            setTimeout(() => playSound(659.25, 'sine'), 120);

            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            const interval = setInterval(function() {
                const particleCount = 20;
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 200);

            setTimeout(() => clearInterval(interval), 2000);
        }

        // Bikin Emoji Melayang di Background
        const emojis = ['💖', '💖', '💊', '✨', '👑', '🔥', '🌸', '🧸'];
        function createFloatingEmoji() {
            const emoji = document.createElement('div');
            emoji.classList.add('bg-emoji');
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.animationDuration = (Math.random() * 3 + 3) + 's';
            emoji.style.fontSize = (Math.random() * 20 + 20) + 'px';
            document.body.appendChild(emoji);

            setTimeout(() => { emoji.remove(); }, 6000);
        }

        setInterval(createFloatingEmoji, 400);

        // Auto confetti pas pertama kali dibuka
        window.onload = () => {
            setTimeout(hebohMax, 500);
        };
    </script>
</body>
</html>
